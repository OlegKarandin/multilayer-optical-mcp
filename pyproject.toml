[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-optical-mcp"
version = "0.1.0"
description = "MCP server for multi-layer optical network reasoning (GNPy QoT + IP-over-optical)."
requires-python = ">=3.11"
readme = "CLAUDE.md"
dependencies = [
    "gnpy==2.14.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
server = ["mcp[cli]>=1.0", "pydantic>=2.0"]
# dev pulls in server too: the test suite imports server.py (tests/test_server_*.py,
# tests/e2e/test_flood_scenario.py), which needs mcp/pydantic.
dev = ["multilayer-optical-mcp[server]", "pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
multilayer-optical-mcp = "multilayer_optical_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
